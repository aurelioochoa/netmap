[workspace]
members = [".", "gui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/aurelioochoa/netmap"

[package]
name = "netmap"
description = "CLI tool that discovers and renders a network topology map in the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "netmap"
path = "src/lib.rs"

[[bin]]
name = "netmap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
quick-xml = { version = "0.31", features = ["serialize"] }
regex = "1"
anyhow = "1"
which = "6"
rustix = { version = "0.38", features = ["process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
which = "6"
